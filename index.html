<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شحن الألعاب</title>

<style>
body{
font-family:tahoma;
background:#f5f5f5;
text-align:center;
margin:0;
}

.container{
background:#fff;
width:90%;
max-width:420px;
margin:20px auto;
padding:15px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button{
width:90%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#28a745;
color:#fff;
border:none;
cursor:pointer;
font-size:16px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>شحن الألعاب</h2>

<input type="text" id="playerId" placeholder="اكتب ID اللاعب">

<select id="package">
<option value="0">اختر الباقة</option>

<option value="30">60 شدة - 30 جنيه</option>
<option value="100">325 شدة - 100 جنيه</option>
<option value="200">660 شدة - 200 جنيه</option>

<option value="30">110 جوهرة - 30 جنيه</option>
<option value="150">530 جوهرة - 150 جنيه</option>
<option value="300">1000 جوهرة - 300 جنيه</option>

</select>

<button onclick="sendOrder()">اطلب الآن</button>

<p>تحويل فودافون كاش: <b>01116816773</b></p>

</div>

<script>
function sendOrder(){
let id = document.getElementById("playerId").value;
let pack = document.getElementById("package");

if(id === "" || pack.value == 0){
alert("اكتب البيانات");
return;
}

let order = {
id: id,
item: pack.options[pack.selectedIndex].text,
price: pack.value,
time: new Date().toLocaleString()
};

// تخزين الطلب
let orders = JSON.parse(localStorage.getItem("orders")) || [];
orders.push(order);
localStorage.setItem("orders", JSON.stringify(orders));

// واتساب
let msg =
"طلب جديد%0A" +
"ID: " + id + "%0A" +
"المنتج: " + order.item + "%0A" +
"السعر: " + order.price;

window.open("https://wa.me/201116816773?text=" + msg, "_blank");

alert("تم إرسال الطلب بنجاح");
}
</script>

</body>
</html>
