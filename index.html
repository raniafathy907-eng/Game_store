<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="google-site-verification" content="XXXXXXX" />
<meta charset="UTF-8">
<title>موقع شحن الألعاب</title>

<style>
body{
font-family:tahoma;
background:#f5f5f5;
text-align:center;
}

.container{
background:#fff;
width:90%;
max-width:400px;
margin:20px auto;
padding:15px;
border-radius:10px;
}

input,select,button{
width:90%;
padding:10px;
margin:8px 0;
}

button{
background:#25D366;
color:#fff;
border:none;
cursor:pointer;
}

.prices{
background:#eee;
padding:10px;
border-radius:10px;
margin:10px 0;
}

.contact{
margin-top:10px;
font-weight:bold;
color:#333;
}
</style>
</head>

<body>

<div class="container">

<h2>🎮 شحن الألعاب</h2>

<!-- 💰 الأسعار -->
<div class="prices">
<h3>💰 الأسعار</h3>
<p>30 جنيه = 100 Diamonds (فري فاير)</p>
<p>35 جنيه = 60 UC (ببجي)</p>
</div>

<select id="game">
<option>اختر اللعبة</option>
<option value="ببجي">شدات ببجي</option>
<option value="فري فاير">فري فاير</option>
</select>

<input type="text" id="id" placeholder="ID اللاعب">

<select id="package">
<option>اختر الباقة</option>
<option value="100 Diamonds - 30 جنيه">100 Diamonds - 30 جنيه</option>
<option value="60 UC - 35 جنيه">60 UC - 35 جنيه</option>
</select>

<input type="number" id="amount" placeholder="عدد الجواهر">

<input type="text" id="last4" placeholder="آخر 4 أرقام من التحويل">

<button onclick="sendOrder()">إرسال الطلب واتساب</button>

<div class="contact">
💳 التحويل على فودافون كاش: 01116816773 <br>
📞 واتساب: 01116816773
</div>

</div>

<script>

function sendOrder(){

let game=document.getElementById("game").value;
let id=document.getElementById("id").value;
let pack=document.getElementById("package").value;
let amount=document.getElementById("amount").value;
let last4=document.getElementById("last4").value;

let msg=
`🎮 طلب شحن:%0A
اللعبة: ${game}%0A
ID: ${id}%0A
الباقة: ${pack}%0A
العدد: ${amount}%0A
آخر 4 أرقام: ${last4}`;

let phone="201116816773";

window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");

alert("تم إرسال الطلب ✔️");
}

</script>

</body>
  </html>
